<?xml version="1.0" encoding="UTF-8"?>
<!-- Service decomposition and interaction topology (Team 2, Delivery 2).
     Hand-authored SVG source: edit directly. Solid = synchronous, dashed = asynchronous (event broker). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="720" viewBox="0 0 1010 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4450"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/>
    </marker>
    <style>
      .svc { fill: #fff; stroke: #2c3440; stroke-width: 1.2; }
      .key { stroke-width: 2.4; }
      .t { font-size: 11px; fill: #1d232b; text-anchor: middle; }
      .ts { font-size: 9px; fill: #5b6573; text-anchor: middle; }
      .cl { font-size: 11px; font-weight: bold; }
      .sync { stroke: #3b4450; stroke-width: 1.3; fill: none; marker-end: url(#a); }
      .async { stroke: #8a8f98; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#g); marker-start: url(#g); }
      .asynce { stroke: #8a8f98; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#g); }
      .ext { stroke: #8a8f98; stroke-width: 1.1; fill: none; marker-end: url(#g); }
      .num { fill: #b3261e; }
      .numt { font-size: 9px; fill: #fff; text-anchor: middle; font-weight: bold; }
      .lbl { font-size: 9px; fill: #3b4450; }
    </style>
  </defs>

  <rect width="1010" height="720" fill="#ffffff"/>

  <!-- Clients -->
  <rect x="150" y="18" width="710" height="40" rx="4" fill="#08427b"/>
  <text x="505" y="43" class="t" style="fill:#fff;font-size:12px">Consumer app · Merchant tablet / portal · Dasher app · Support console</text>

  <!-- Edge -->
  <rect x="150" y="88" width="825" height="68" rx="8" fill="#eceff3" stroke="#9aa3ae"/>
  <text x="165" y="126" class="cl" fill="#3b4450">Edge</text>
  <rect x="260" y="100" width="260" height="44" rx="8" class="svc"/>
  <text x="390" y="119" class="t">API Gateway</text>
  <text x="390" y="134" class="ts">routing · token check · rate limiting · BFF</text>
  <rect x="700" y="100" width="260" height="44" rx="8" class="svc"/>
  <text x="830" y="119" class="t">Real-time Gateway</text>
  <text x="830" y="134" class="ts">persistent connections · fan-out</text>

  <path d="M390,58 L390,99" class="sync"/>
  <text x="396" y="80" class="lbl">HTTPS</text>
  <path d="M830,60 L830,99" class="sync" style="marker-start:url(#a)"/>
  <text x="836" y="80" class="lbl">persistent connection</text>

  <!-- Commerce & merchant domain -->
  <rect x="20" y="186" width="455" height="164" rx="8" fill="#fdf1f0" stroke="#e0a9a5"/>
  <text x="30" y="202" class="cl" fill="#8c1d17">Commerce &amp; merchant domain</text>
  <rect x="35" y="222" width="120" height="46" rx="8" class="svc"/>
  <text x="95" y="249" class="t">Identity &amp; Account</text>
  <rect x="180" y="222" width="120" height="46" rx="8" class="svc"/>
  <text x="240" y="249" class="t">Merchant Catalog</text>
  <rect x="325" y="222" width="120" height="46" rx="8" class="svc"/>
  <text x="385" y="249" class="t">Search &amp; Discovery</text>
  <rect x="35" y="290" width="120" height="46" rx="8" class="svc"/>
  <text x="95" y="317" class="t">Payment</text>
  <rect x="180" y="290" width="120" height="46" rx="8" class="svc key" style="stroke:#b3261e"/>
  <text x="240" y="310" class="t" style="font-weight:bold">Order</text>
  <text x="240" y="325" class="ts">state machine · saga</text>
  <rect x="325" y="290" width="120" height="46" rx="8" class="svc" style="fill:#fbf6ec"/>
  <text x="385" y="310" class="t">Merchant</text>
  <text x="385" y="324" class="t">Integration</text>

  <!-- Logistics domain -->
  <rect x="490" y="186" width="500" height="164" rx="8" fill="#eef4ec" stroke="#a9c7a2"/>
  <text x="500" y="202" class="cl" fill="#2f5d27">Logistics domain</text>
  <rect x="505" y="222" width="105" height="46" rx="8" class="svc"/>
  <text x="557" y="249" class="t">Route &amp; ETA</text>
  <rect x="625" y="222" width="105" height="46" rx="8" class="svc key" style="stroke:#2f5d27"/>
  <text x="677" y="249" class="t" style="font-weight:bold">Dispatch</text>
  <rect x="745" y="222" width="105" height="46" rx="8" class="svc"/>
  <text x="797" y="249" class="t">Dasher</text>
  <rect x="865" y="222" width="105" height="46" rx="8" class="svc"/>
  <text x="917" y="242" class="t">Tracking</text>
  <text x="917" y="257" class="ts">read model</text>
  <rect x="625" y="290" width="105" height="46" rx="8" class="svc"/>
  <text x="677" y="317" class="t">Location</text>

  <!-- Gateway to domains -->
  <path d="M330,144 L250,185" class="sync"/>
  <path d="M450,144 L640,185" class="sync"/>
  <text x="262" y="166" class="lbl">REST</text>
  <text x="555" y="160" class="lbl">REST</text>
  <!-- Tracking -> Real-time gateway -->
  <path d="M917,221 L917,145" class="asynce"/>
  <text x="923" y="185" class="lbl">push view</text>

  <!-- Synchronous service-to-service calls (numbered) -->
  <path d="M240,289 L240,269" class="sync"/>                      <!-- 1 Order -> Catalog -->
  <path d="M179,313 L156,313" class="sync"/>                      <!-- 2 Order -> Payment -->
  <path d="M240,337 L240,343 L482,343 L482,252 L504,252" class="sync"/> <!-- 3 Order -> Route & ETA -->
  <path d="M446,240 L504,240" class="sync"/>                      <!-- 4 Search -> Route & ETA -->
  <path d="M624,245 L611,245" class="sync"/>                      <!-- 5 Dispatch -> Route & ETA -->
  <path d="M731,245 L744,245" class="sync"/>                      <!-- 6 Dispatch -> Dasher -->

  <circle cx="252" cy="279" r="7" class="num"/><text x="252" y="282" class="numt">1</text>
  <circle cx="167" cy="303" r="7" class="num"/><text x="167" y="306" class="numt">2</text>
  <circle cx="470" cy="343" r="7" class="num"/><text x="470" y="346" class="numt">3</text>
  <circle cx="470" cy="231" r="7" class="num"/><text x="470" y="234" class="numt">4</text>
  <circle cx="617" cy="233" r="7" class="num"/><text x="617" y="236" class="numt">5</text>
  <circle cx="737" cy="233" r="7" class="num"/><text x="737" y="236" class="numt">6</text>

  <!-- Event broker -->
  <rect x="20" y="385" width="960" height="54" rx="4" fill="#2c3440"/>
  <text x="500" y="406" class="t" style="fill:#fff;font-weight:bold;font-size:12px">EVENT BROKER — durable, partitioned, replayable topics (at-least-once)</text>
  <text x="500" y="426" class="t" style="fill:#d5dae1;font-size:10px">account.events · catalog.events · order.events · payment.events · merchant.events · dasher.events · location.updates · dispatch.events · eta.events</text>

  <path d="M140,352 L140,383" class="async"/>
  <path d="M300,352 L300,383" class="async"/>
  <path d="M740,352 L740,383" class="async"/>
  <path d="M880,352 L880,383" class="async"/>
  <text x="306" y="372" class="lbl">publish / consume</text>
  <text x="746" y="372" class="lbl">publish / consume</text>

  <!-- Engagement & data -->
  <rect x="180" y="470" width="540" height="80" rx="8" fill="#eef1f8" stroke="#a6b3d3"/>
  <text x="280" y="486" class="cl" fill="#2c3f73">Engagement &amp; data (event consumers)</text>
  <rect x="200" y="494" width="130" height="44" rx="8" class="svc"/>
  <text x="265" y="520" class="t">Notification</text>
  <rect x="580" y="494" width="120" height="44" rx="8" class="svc"/>
  <text x="640" y="514" class="t">Analytics</text>
  <text x="640" y="528" class="t">Ingestion</text>
  <path d="M265,441 L265,493" class="asynce"/>
  <path d="M640,441 L640,493" class="asynce"/>
  <text x="271" y="462" class="lbl">consume</text>
  <text x="646" y="462" class="lbl">consume</text>
  <!-- Notification -> Real-time gateway (in-app push) -->
  <path d="M305,539 L305,565 L996,565 L996,122 L961,122" class="asynce"/>
  <text x="780" y="560" class="lbl">in-app push via Real-time Gateway</text>

  <!-- External systems -->
  <rect x="20" y="590" width="960" height="62" rx="6" fill="#f3f5f8" stroke="#8a8f98" stroke-dasharray="4 3"/>
  <text x="30" y="604" class="lbl" style="font-weight:bold">External systems (outside the boundary)</text>
  <rect x="40" y="610" width="120" height="34" rx="4" fill="#8a8f98"/>
  <text x="100" y="631" class="t" style="fill:#fff">Payment processor</text>
  <rect x="205" y="610" width="120" height="34" rx="4" fill="#8a8f98"/>
  <text x="265" y="631" class="t" style="fill:#fff">Push / SMS gateways</text>
  <rect x="335" y="610" width="110" height="34" rx="4" fill="#8a8f98"/>
  <text x="390" y="631" class="t" style="fill:#fff">Merchant POS</text>
  <rect x="497" y="610" width="120" height="34" rx="4" fill="#8a8f98"/>
  <text x="557" y="631" class="t" style="fill:#fff">Maps provider</text>
  <rect x="800" y="610" width="160" height="34" rx="4" fill="#8a8f98"/>
  <text x="880" y="626" class="t" style="fill:#fff">Identity verification</text>
  <text x="880" y="638" class="ts" style="fill:#eceff3">(called by Identity &amp; Account)</text>

  <path d="M100,337 L100,609" class="ext"/>
  <path d="M265,539 L265,609" class="ext"/>
  <path d="M390,337 L390,609" class="ext"/>
  <path d="M557,269 L557,609" class="ext"/>

  <!-- Legend -->
  <line x1="24" y1="676" x2="58" y2="676" class="sync"/>
  <text x="64" y="679" class="lbl">synchronous request / response</text>
  <line x1="220" y1="676" x2="254" y2="676" class="asynce"/>
  <text x="260" y="679" class="lbl">asynchronous event (via broker)</text>
  <text x="24" y="700" class="lbl">Sync calls: (1) Order → Catalog price/availability check · (2) Order → Payment authorize · (3) Order → Route &amp; ETA delivery-window quote ·</text>
  <text x="24" y="713" class="lbl">(4) Search → Route &amp; ETA window estimates · (5) Dispatch → Route &amp; ETA travel-time matrix · (6) Dispatch → Dasher reserve Dasher (conditional write)</text>
</svg>
